[package]
name = "KOALA"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.29"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# El binario se instala como `koala` en KOALA para que los scripts de waybar lo
# encuentren simple (ejecutar `cargo install --path .`)
[[bin]]
name = "koala"
path = "src/main.rs"
